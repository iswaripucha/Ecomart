<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoMart - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f4f7f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: #1b4332;
      color: white;
    }

    .ecologo {
      height: 45px;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      cursor: pointer;
    }

    .ecologo:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
    }
    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      transition: color 0.3s;
    }
    .nav-links a:hover {
      color: #ffec9f;
    }

    .user-menu {
      position: relative;
      display: inline-block;
    }
    .username {
      color: white;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .username:after {
      content: '▼';
      font-size: 10px;
      margin-left: 5px;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      background: tomato;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .dropdown-menu a {
      color: white;
      padding: 10px 15px;
      display: block;
      text-decoration: none;
    }
    .dropdown-menu a:hover {
      background: #ff6347;
    }
    .user-menu.active .dropdown-menu {
      display: block;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
    }

    .dashboard-title {
      color: #2e7d32;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 30px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: white;
      border-radius: 8px;
      text-align: center;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #2e7d32;
    }

    .stat-label {
      color: #666;
      margin-top: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #2e7d32;
      color: white;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .action-btn {
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      cursor: pointer;
      color: white;
      font-size: 0.9rem;
    }

    .approve-btn { background: #2e7d32; }
    .reject-btn { background: #e53935; }
    .delete-btn { background: #d32f2f; }
    .block-btn { background: #b71c1c; }

    footer {
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
      color: #666;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center;">
      <img src="logo.jpg" alt="EcoMart Logo" class="ecologo" style="margin-right: 15px;">
      <div>
        <span style="font-size: 1.6rem; font-weight: bold;">EcoMart</span><br>
        <small style="color: #dadada;">Admin Dashboard</small>
      </div>
    </div>

    <nav>
      <ul class="nav-links">
        <li><a href="eco_home.html">Home</a></li>
        <div class="user-menu">
          <a href="#" class="username" id="usernameDisplay">Hello Admin</a>
          <div class="dropdown-menu">
            <a href="loginpage.html" id="logoutLink">Logout</a>
          </div>
        </div>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="dashboard-title">Admin Control Panel</h1>

    <!-- STATISTICS SECTION -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-value" id="total-users">0</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-products">0</div>
        <div class="stat-label">Total Listings</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="pending-approvals">0</div>
        <div class="stat-label">Pending Approvals</div>
      </div>
    </div>

    <!-- PRODUCT MANAGEMENT -->
    <h2 style="color:#2e7d32;">Product Listings</h2>
    <table id="product-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Seller</th>
          <th>Category</th>
          <th>Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filled dynamically -->
      </tbody>
    </table>

    <!-- USER MANAGEMENT -->
    <h2 style="color:#2e7d32; margin-top:40px;">Registered Users</h2>
    <table id="user-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filled dynamically -->
      </tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2025 EcoMart. All Rights Reserved.</p>
  </footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const userMenu = document.querySelector('.user-menu');
  const username = document.querySelector('.username');

  username.addEventListener('click', function(e) {
    e.preventDefault();
    userMenu.classList.toggle('active');
  });
  document.addEventListener('click', function(e) {
    if (!userMenu.contains(e.target)) {
      userMenu.classList.remove('active');
    }
  });

  // Display greeting: prefer stored full name when admin is logged in
  try {
    const storedFullName = localStorage.getItem('ecomartFullName');
    const storedRole = localStorage.getItem('ecomartRole');
    if (storedRole === 'admin' && storedFullName) {
      document.getElementById('usernameDisplay').textContent = `Hello, ${storedFullName}`;
    } else {
      document.getElementById('usernameDisplay').textContent = 'Hello Admin';
    }
  } catch (e) {
    // ignore if localStorage isn't available
  }

  // Logout: clear stored identity
  const logoutLink = document.getElementById('logoutLink');
  if (logoutLink) {
    logoutLink.addEventListener('click', function() {
      localStorage.removeItem('ecomartUsername');
      localStorage.removeItem('ecomartFullName');
      localStorage.removeItem('ecomartRole');
    });
  }

  // Set backend URL explicitly (port 3000)
  const backendUrl = 'http://127.0.0.1:3000';

  // Fetch products and users from backend
  async function loadData() {
    try {
      // Fetch users
      const userRes = await fetch(`${backendUrl}/admin/users`);
      if (!userRes.ok) throw new Error("Failed to fetch users");
      const users = await userRes.json();

      // Populate user table
      const userTable = document.getElementById('user-table').querySelector('tbody');
      userTable.innerHTML = ""; 
      users.forEach((u) => {
        const row = document.createElement('tr');
        const status = u.status || "Active";
        let actionBtnHtml = '';
        if (u.role === 'admin') {
          actionBtnHtml = `<button class="action-btn" disabled>—</button>`;
        } else {
          actionBtnHtml = status === 'Blocked'
            ? `<button class="action-btn block-btn" onclick="unblockUser('${u.userid}')">Unblock</button>`
            : `<button class="action-btn block-btn" onclick="blockUser('${u.userid}')">Block</button>`;
        }

        row.innerHTML = `
          <td>${u.userid}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>${status}</td>
          <td>${actionBtnHtml}</td>
        `;
        userTable.appendChild(row);
      });

      // Fetch products
      const productRes = await fetch(`${backendUrl}/admin/products`);
      if (!productRes.ok) throw new Error("Failed to fetch products");
      const products = await productRes.json();

      const productTable = document.getElementById('product-table').querySelector('tbody');
      productTable.innerHTML = "";
      products.forEach((p) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.title}</td>
          <td>${p.sellerName}</td>
          <td>${p.category}</td>
          <td>₹${p.price}</td>
          <td>${p.status}</td>
          <td>
            ${p.status === 'Pending' ? `
              <button class="action-btn approve-btn" onclick="approveProduct('${p.id}')">Approve</button>
              <button class="action-btn reject-btn" onclick="rejectProduct('${p.id}')">Reject</button>
            ` : `
              <button class="action-btn delete-btn" onclick="deleteProduct('${p.id}')">Delete</button>
            `}
          </td>
        `;
        productTable.appendChild(row);
      });

      // Update stats
      document.getElementById('total-users').textContent = users.length;
      document.getElementById('total-products').textContent = products.length;
      document.getElementById('pending-approvals').textContent = products.filter(p => p.status === 'Pending').length;

    } catch (err) {
      console.error(err);
      alert("Unable to fetch data from server. Make sure your backend is running on port 3000.");
    }
  }

  // Action Functions
  window.approveProduct = async function(productId) {
    try {
      await fetch(`${backendUrl}/admin/products/${productId}/approve`, { method: "POST" });
      alert("Product Approved ✅");
      loadData();
    } catch {
      alert("Action failed.");
    }
  }

  window.rejectProduct = async function(productId) {
    try {
      await fetch(`${backendUrl}/admin/products/${productId}/reject`, { method: "POST" });
      alert("Product Rejected ❌");
      loadData();
    } catch {
      alert("Action failed.");
    }
  }

  window.deleteProduct = async function(productId) {
    try {
      await fetch(`${backendUrl}/admin/products/${productId}`, { method: "DELETE" });
      alert("Product Deleted 🗑️");
      loadData();
    } catch {
      alert("Action failed.");
    }
  }

  window.blockUser = async function(userid) {
    try {
      const res = await fetch(`${backendUrl}/admin/users/${userid}/block`, { method: "POST" });
      let body = null;
      try { body = await res.json(); } catch (e) { /* ignore parse errors */ }
      if (!res.ok) {
        console.error('Block user failed', { userid, status: res.status, body });
        alert(body && (body.error || body.message) ? (body.error || body.message) : 'Action failed.');
        return;
      }
      alert("User blocked 🚫");
      loadData();
    } catch (err) {
      console.error('Block user exception', err);
      alert("Action failed.");
    }
  }

  window.unblockUser = async function(userid) {
    try {
      const res = await fetch(`${backendUrl}/admin/users/${userid}/unblock`, { method: "POST" });
      let body = null;
      try { body = await res.json(); } catch (e) { /* ignore parse errors */ }
      if (!res.ok) {
        console.error('Unblock user failed', { userid, status: res.status, body });
        alert(body && (body.error || body.message) ? (body.error || body.message) : 'Action failed.');
        return;
      }
      alert("User unblocked ✅");
      loadData();
    } catch (err) {
      console.error('Unblock user exception', err);
      alert("Action failed.");
    }
  }

  loadData(); // initial load
});
</script>


</body>
</html>
