<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Form | EcoMart</title>
  <style>
    /* Body */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Navigation Bar */
    .navbar {
      background: #1b4332;  /* Dark Green */
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar .logo {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
    }

    .navbar .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .navbar .nav-links li a {
      color: #fff;
      text-decoration: none;
      font-size: 16px;
    }

    .navbar .nav-links li a:hover {
      text-decoration: underline;
    }

    /* Form */
    .form-container {
      background: #fff;
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    }

    .form-container h2 {
      margin-bottom: 20px;
      color: #1b4332;
    }

    .form-container label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    .form-container input,
    .form-container select,
    .form-container textarea,
    .form-container button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .form-container textarea {
      resize: vertical;
    }

    .form-container .radio-group {
      margin-top: 5px;
      margin-bottom: 15px;
    }

    .form-container .radio-group label {
      font-weight: normal;
      margin-right: 15px;
    }

    .form-container button {
      background: #1b4332;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }

    .form-container button:hover {
      background: #14532d;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">EcoMart</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Buy</a></li>
      <li><a href="#">Sell</a></li>
      <li><a href="#">My Listings</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </nav>

  <!-- Seller Form -->
  <div class="form-container">
    <h2>Seller Form</h2>
    <form>
      <!-- Item Title -->
      <label for="title">Item Title:</label>
      <input type="text" id="title" name="title" required>

      <!-- Category -->
      <label for="category">Category:</label>
      <select id="category" name="category">
        <option>Books</option>
        <option>Electronics</option>
        <option>Furniture</option>
        <option>Accessories</option>
        <option>Others</option>
      </select>

      <!-- Price -->
      <label for="price">Price (₹):</label>
      <input type="number" id="price" name="price">

      <!-- Condition -->
      <label>What is the condition of the product?</label>
      <div class="radio-group">
        <input type="radio" id="new" name="condition" value="new">
        <label for="new">almost new</label>

        <input type="radio" id="gently_used" name="condition" value="gently_used">
        <label for="gently_used">Average</label>

        <input type="radio" id="old" name="condition" value="old">
        <label for="old">Old</label>
      </div>

      <!-- Description -->
      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4"></textarea>

      <!-- Upload Images -->
      <label for="images">Upload Product Images:</label>
      <input type="file" id="images" name="images" accept="image/*" multiple>

      <!-- Upload Video -->
      <label for="video">Upload Product Video (optional):</label>
      <input type="file" id="video" name="video" accept="video/*" required>

      <!-- Submit -->
      <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
